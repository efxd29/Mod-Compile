<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>GROW Island</title>
  <style>
    :root, html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    body { display: flex; align-items: center; justify-content: center; }
    #game { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    ruffle-player { display: block; width: 100%; height: 100%; }
    #fallback {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box; color: #333; background: #fff;
      font: 16px/1.5 sans-serif; text-align: center;
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "on",
      scale: "showAll",
      backgroundColor: "#FFFFFF",
      logLevel: "error",
      warnOnUnsupportedContent: false,
      showSwfDownload: false,
      contextMenu: false,
      openUrlMode: "deny",
      allowScriptAccess: false
    };
  </script>
  <script src="ruffle/ruffle.js"></script>
</head>
<body>
  <main id="game" aria-label="GROW Island game"></main>
  <div id="fallback">The offline Flash player could not start. Please reinstall the APK or try again.</div>
  <script>
    (function () {
      try {
        const ruffleApi = window.RufflePlayer && window.RufflePlayer.newest();
        if (!ruffleApi) throw new Error("Ruffle is not available");
        const player = ruffleApi.createPlayer();
        player.style.width = "100%";
        player.style.height = "100%";
        document.getElementById("game").appendChild(player);
        const fallback = document.getElementById("fallback");
        function showFailure(error) {
          fallback.textContent = "GROW Island gagal dimuat. Coba perbarui Android System WebView/Chrome. Detail: " + (error && error.message ? error.message : String(error || "Unknown error"));
          fallback.style.display = "flex";
          console.error("Ruffle load failed", error);
        }
        player.addEventListener("error", function (event) {
          showFailure(event && event.detail ? event.detail : "Ruffle player error");
        });
        const loadResult = player.ruffle().load("https://appassets.androidplatform.net/assets/growisland.swf");
        if (loadResult && typeof loadResult.catch === "function") {
          loadResult.catch(showFailure);
        }
      } catch (error) {
        document.getElementById("fallback").style.display = "flex";
      }
    })();
  </script>
</body>
</html>
