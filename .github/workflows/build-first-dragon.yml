name: Build First Dragon 26.3
on:
  push:
    paths:
      - 'zips/trigger-first-dragon-build'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Decode source project
        shell: bash
        run: |
          cat zips/first-dragon-project-part*.b64 | base64 --decode > /tmp/first-dragon-source.zip
          mkdir -p /tmp/first-dragon-source
          unzip -q /tmp/first-dragon-source.zip -d /tmp/first-dragon-source
          SRC=/tmp/first-dragon-source/first-dragon-build/src/main/java/dev/dragonfirst/DragonFirstState.java
          sed -i 's/import net.minecraft.world.entity.EntityType;/import net.minecraft.world.entity.EntityTypes;/; s/EntityType.END_CRYSTAL/EntityTypes.END_CRYSTAL/' "$SRC"
          MIXINS=/tmp/first-dragon-source/first-dragon-build/src/main/resources/dragonfirst.mixins.json
          sed -i '/"BlockStateCollisionMixin",/d' "$MIXINS"
          rm -f /tmp/first-dragon-source/first-dragon-build/src/main/java/dev/dragonfirst/mixin/BlockStateCollisionMixin.java
          PROPS=/tmp/first-dragon-source/first-dragon-build/gradle.properties
          sed -i 's/^version=1.0.1$/version=1.0.3/' "$PROPS"
          MIXINS=/tmp/first-dragon-source/first-dragon-build/src/main/resources/dragonfirst.mixins.json
          sed -i '/"BlockStateCollisionMixin",/d' "$MIXINS"
          rm -f /tmp/first-dragon-source/first-dragon-build/src/main/java/dev/dragonfirst/mixin/BlockStateCollisionMixin.java
          python - <<'PY'
          from pathlib import Path
          root = Path("/tmp/first-dragon-source/first-dragon-build")
          mixins = root / "src/main/resources/dragonfirst.mixins.json"
          text = mixins.read_text()
          text = text.replace('    "BlockStateCollisionMixin",\n', '')
          mixins.write_text(text)
          (root / "src/main/java/dev/dragonfirst/mixin/BlockStateCollisionMixin.java").unlink(missing_ok=True)
          print("Removed startup-crashing collision mixin.")
          PY
          test -f /tmp/first-dragon-source/first-dragon-build/build.gradle
          test -f /tmp/first-dragon-source/first-dragon-build/src/main/java/dev/dragonfirst/DragonFirstState.java
      - name: Inspect collision and portal rules before patch
        shell: bash
        run: |
          ROOT=/tmp/first-dragon-source/first-dragon-build/src/main/java/dev/dragonfirst
          for F in "$ROOT/mixin/BlockItemMixin.java" "$ROOT/mixin/EnderDragonMixin.java" "$ROOT/mixin/EndPortalBlockMixin.java" "$ROOT/mixin/DragonFightMixin.java"; do
            echo "===== SOURCE $F ====="
            cat "$F"
          done
          echo "===== SOURCE DragonFirstState key members ====="
          grep -nE 'portal|Portal|destroy|Destroy|placed|Placed|block|Block|encounter|Encounter|canUsePortal|tickPortal' "$ROOT/DragonFirstState.java" | head -220
      - name: Apply First Dragon 1.0.3 fixes
        shell: bash
        run: |
          python zips/patch-first-dragon-1.0.3.py /tmp/first-dragon-source/first-dragon-build
          grep -nE 'version=|firstWinTowerCrystalsApplied|lastPortalPermission|completedRespawn.put\(id' /tmp/first-dragon-source/first-dragon-build/gradle.properties /tmp/first-dragon-source/first-dragon-build/src/main/java/dev/dragonfirst/DragonFirstState.java
      - name: Install Gradle 9.7.1
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-delay 2 https://services.gradle.org/distributions/gradle-9.7.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-9.7.1/bin" >> "$GITHUB_PATH"
      - name: Compile mod
        working-directory: /tmp/first-dragon-source/first-dragon-build
        shell: bash
        run: gradle build --no-daemon --console=plain
      - name: Stage JAR before runtime test
        shell: bash
        run: |
          mkdir -p out
          JAR="$(find /tmp/first-dragon-source/first-dragon-build/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -1)"
          test -n "$JAR"
          cp "$JAR" out/First-Dragon-26.3-1.0.3.jar
      - name: Smoke-test on a real Fabric 26.3 server
        shell: bash
        run: |
          set -euo pipefail
          TEST=/tmp/first-dragon-runtime-test
          mkdir -p "$TEST/mods"
          cp out/First-Dragon-26.3-1.0.3.jar "$TEST/mods/"
          curl --fail --location --retry 3 --retry-delay 2 "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.162.0+26.3/fabric-api-0.162.0+26.3.jar" -o "$TEST/mods/fabric-api-0.162.0+26.3.jar"
          echo "eula=true" > "$TEST/eula.txt"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://meta.fabricmc.net/v2/versions/loader/26.3/0.19.5/1.1.2/server/jar" \
            -o "$TEST/fabric-server-launch.jar"
          cd "$TEST"
          set +e
          timeout 90s java -Xms256M -Xmx2G -jar fabric-server-launch.jar nogui > runtime.log 2>&1
          RC=$?
          set -e
          cat runtime.log
          if grep -Eqi "Mixin apply failed|InvalidInjectionException|InjectionError|Failed to launch|Could not execute entrypoint|Exception in thread|NoClassDefFoundError|ClassNotFoundException" runtime.log; then
            echo "First Dragon runtime smoke test found a startup error."
            exit 1
          fi
          if ! grep -Eqi "Done \([0-9.]+s\)!|Done \([0-9.]+ seconds\)" runtime.log; then
            echo "Fabric server did not reach the ready marker; exit code $RC."
            exit 1
          fi
          grep -E "Loading Minecraft|First Dragon|DragonFirst|Done \(" runtime.log || true
      - name: Verify and stage JAR
        shell: bash
        run: |
          mkdir -p out
          find /tmp/first-dragon-source/first-dragon-build/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' -print
          JAR="$(find /tmp/first-dragon-source/first-dragon-build/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -1)"
          test -n "$JAR"
          cp "$JAR" out/First-Dragon-26.3-1.0.3.jar
          unzip -t out/First-Dragon-26.3-1.0.3.jar
          unzip -p out/First-Dragon-26.3-1.0.3.jar fabric.mod.json
          unzip -l out/First-Dragon-26.3-1.0.3.jar
      - uses: actions/upload-artifact@v4
        with:
          name: First-Dragon-26.3-1.0.3
          path: out/First-Dragon-26.3-1.0.3.jar
          if-no-files-found: error
          retention-days: 7
