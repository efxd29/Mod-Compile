name: Android launcher build

on:
  push:
    branches: [minecraft-pc-launcher]
    paths:
      - 'minecraft-pc-launcher/**'
      - '.github/workflows/minecraft-pc-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android launcher APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout launcher overlay
        uses: actions/checkout@v4
        with:
          ref: minecraft-pc-launcher
          path: overlay-repo

      - name: Checkout upstream Java Edition engine
        uses: actions/checkout@v4
        with:
          repository: TeamPojavLauncher/PojavLauncher
          ref: v3_openjdk
          path: engine
          fetch-depth: 1
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Get optional LTW renderer dependency
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: engine/app_pojavlauncher/libs

      - name: Get optional Mesa renderer dependency
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: engine/app_pojavlauncher/libs

      - name: Apply PC-inspired launcher home screen
        run: |
          cd overlay-repo
          bash minecraft-pc-launcher/apply-overlay.sh ../engine
          cd ..

      - name: Build Full Debug APK
        working-directory: engine
        run: gradle :app_pojavlauncher:assembleFullDebug --no-daemon --stacktrace

      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-launcher-debug-apk
          path: engine/app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk
          if-no-files-found: error
          retention-days: 7
