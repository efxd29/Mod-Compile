name: Build Codex Android APK

on:
  push:
    branches: [codex]
    paths:
      - 'Codex-source.part-*.b64'
      - 'Codex-overlay/**'
      - '.github/workflows/build-codex-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Decode source archive
        shell: bash
        run: |
          set -euo pipefail
          cat Codex-source.part-*.b64 | base64 --decode > Codex-source.tar.xz
          tar -xJf Codex-source.tar.xz
          if [ -d Codex-overlay ]; then
            cp -a Codex-overlay/. Codex/
          fi
          test -f Codex/android/app/build.gradle
          test -f Codex/server.js

      - name: Verify JavaScript syntax
        run: |
          node --check Codex/server.js
          node --check Codex/public/app.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: Codex/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="Codex/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-debug-apk
          path: Codex/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
