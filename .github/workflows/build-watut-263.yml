name: Build WATUT MC 26.3 activity fix

on:
  push:
    branches:
      - watut-26.3-activity-fix
    paths:
      - '.github/workflows/build-watut-263.yml'
      - 'zips/patch-watut-263.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download WATUT and matching MC 26.3 CoroUtil API
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 26.2 https://github.com/sdrumati04/WATUTfork.git /tmp/watut
          mkdir -p /tmp/watut/libs
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://tmpfiles.org/dl/w1AnZaVG2ubV/coroutil-fabric-26.3-1.3.8.jar' \
            -o /tmp/watut/libs/coroutil-fabric-26.3-1.3.8.jar
          unzip -t /tmp/watut/libs/coroutil-fabric-26.3-1.3.8.jar >/dev/null
          python zips/patch-watut-263.py /tmp/watut
          test -f /tmp/watut/src/main/java/com/corosus/watut/client/status/PlayerStatusClientManager.java

      - name: Install Gradle 9.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-9.7.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-9.7.1/bin" >> "$GITHUB_PATH"

      - name: Build WATUT
        working-directory: /tmp/watut
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Gradle 9 no longer accepts the legacy -b switch; use the selected Fabric build file as build.gradle.
          cp build_fabric.gradle build.gradle
          ./gradlew clean build --no-daemon --console=plain --stacktrace

      - name: Validate JAR metadata and tick event wiring
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          JAR="$(find /tmp/watut/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -1)"
          test -n "$JAR"
          cp "$JAR" out/watut-fabric-26.3-1.2.5-activityfix1.jar
          unzip -t out/watut-fabric-26.3-1.2.5-activityfix1.jar
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          jar = Path("out/watut-fabric-26.3-1.2.5-activityfix1.jar")
          with zipfile.ZipFile(jar) as z:
              meta = json.loads(z.read("fabric.mod.json"))
              cfg = json.loads(z.read("watut.mixins.json"))
              assert meta["id"] == "watut", meta["id"]
              assert meta["version"] == "26.3-1.2.5-activityfix1", meta["version"]
              assert meta["depends"]["minecraft"] == "~26.3", meta["depends"]
              assert meta["depends"]["coroutil"] == ">=26.3-1.3.8", meta["depends"]
              all_mixins = cfg.get("client", []) + cfg.get("mixins", [])
              for old in ("client.MinecraftTick", "client.ClientPlayerTick", "PlayerTick", "PlayerLoggedIn"):
                  assert old not in all_mixins, f"old per-player tick hook still active: {old}"
              for cls in (
                  "com/corosus/watut/client/status/PlayerStatusClientManager.class",
                  "com/corosus/watut/client/WatutClientMod.class",
                  "com/corosus/watut/WatutMod.class",
                  "watut.mixins.json",
                  "fabric.mod.json",
              ):
                  assert cls in z.namelist(), f"missing {cls}"
              print("Validated:", meta["id"], meta["version"], "jar bytes:", jar.stat().st_size)
              print("Mixin entries retained:", len(all_mixins))
          PY
          sha256sum out/watut-fabric-26.3-1.2.5-activityfix1.jar

      - uses: actions/upload-artifact@v4
        with:
          name: WATUT-MC26.3-activity-fix1
          path: out/watut-fabric-26.3-1.2.5-activityfix1.jar
          if-no-files-found: error
          retention-days: 30
