name: Mostly Server Capes 26.3 Port
on:
  push:
    paths:
      - 'zips/trigger-mostly-server-capes-build'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch original source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Mr-Zombii/MostlyServerSideCapes.git /tmp/msc
          test -f /tmp/msc/src/main/java/me/zombii/mostly_server_capes/MostlyServerCapes.java
      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 https://services.gradle.org/distributions/gradle-9.7.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-9.7.1/bin" >> "$GITHUB_PATH"
      - name: Migrate old Yarn source to Mojang mappings
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/msc
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("build.gradle")
          s = p.read_text()
          s = s.replace("id 'fabric-loom' version '1.7-SNAPSHOT'", "id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'")
          p.write_text(s)
          p = Path("gradle.properties")
          s = p.read_text()
          s = re.sub(r"(?m)^minecraft_version=.*$", "minecraft_version=1.21.3", s)
          s = re.sub(r"(?m)^yarn_mappings=.*$", "yarn_mappings=1.21.3+build.2", s)
          s = re.sub(r"(?m)^loader_version=.*$", "loader_version=0.16.7", s)
          s = re.sub(r"(?m)^fabric_version=.*$", "fabric_version=0.114.1+1.21.3", s)
          p.write_text(s)
          PY
          gradle migrateMappings --mappings "net.minecraft:mappings:1.21.3" --overrideInputsIHaveABackup --no-daemon --console=plain
      - name: Port project build and metadata to 26.3
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/msc
          python - <<'PY'
          from pathlib import Path
          import json, re
          root = Path(".")
          p = root / "build.gradle"
          s = p.read_text()
          s = s.replace("id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'", "id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'")
          s = re.sub(r'(?m)^\s*mappings\s+"net\.fabricmc:yarn:.*?\n', '', s)
          s = s.replace("modImplementation ", "implementation ")
          s = re.sub(r'(?m)^\s*modApi\(files\("run/mods/fabrictailor-2\.5\.0\.jar"\)\)\s*\n?', '', s)
          s = re.sub(r'(?m)^\s*it\.options\.release = 21\s*$', '    it.options.release = 25', s)
          s = s.replace("JavaVersion.VERSION_21", "JavaVersion.VERSION_25")
          p.write_text(s)
          p = root / "gradle.properties"
          s = p.read_text()
          s = re.sub(r"(?m)^minecraft_version=.*$", "minecraft_version=26.3", s)
          s = re.sub(r"(?m)^mod_version=.*$", "mod_version=26.3-2.0.3-port1", s)
          s = re.sub(r"(?m)^loader_version=.*$", "loader_version=0.19.5", s)
          s = re.sub(r"(?m)^fabric_version=.*$", "fabric_version=0.163.0+26.3", s)
          s = re.sub(r"(?m)^yarn_mappings=.*\n?", "", s)
          p.write_text(s)
          mixin_path = root / "src/main/resources/mostly_server_capes.mixins.json"
          m = json.loads(mixin_path.read_text())
          m["mixins"] = [x for x in m.get("mixins", []) if x not in ("FabricTailorCompatMixin", "TailorNetworkHandlerMixin")]
          mixin_path.write_text(json.dumps(m, indent=2) + "\n")
          for rel in (
              "src/main/java/me/zombii/mostly_server_capes/mixin/FabricTailorCompatMixin.java",
              "src/main/java/me/zombii/mostly_server_capes/mixin/TailorNetworkHandlerMixin.java",
          ):
              (root / rel).unlink(missing_ok=True)
          main = root / "src/main/java/me/zombii/mostly_server_capes/MostlyServerCapes.java"
          s = main.read_text()
          s = s.replace("import org.samo_lego.fabrictailor.FabricTailor;\n", "")
          s = s.replace("import org.samo_lego.fabrictailor.mixin.accessors.AChunkMap;\n", "")
          s = s.replace("import org.samo_lego.fabrictailor.mixin.accessors.ATrackedEntity;\n", "")
          s = s.replace("FabricTailor.errorLog(\"Tried to reload skin form client side! This should not happen!\");", "LOGGER.warn(\"Tried to reload skin from client side; ignoring request.\");")
          main.write_text(s)
          meta = root / "src/main/resources/fabric.mod.json"
          d = json.loads(meta.read_text())
          d["version"] = "26.3-2.0.3-port1"
          d["depends"]["fabricloader"] = ">=0.19.5"
          d["depends"]["minecraft"] = "~26.3"
          d["depends"]["java"] = ">=25"
          d["depends"]["fabric-api"] = "*"
          d.pop("suggests", None)
          meta.write_text(json.dumps(d, indent=2) + "\n")
          print("Prepared port:", d["version"], d["depends"])

      - name: Apply 26.3 API and package migration
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/msc
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("src")
          substitutions = [
              ("net.minecraft.network.packet.s2c.play", "net.minecraft.network.protocol.game"),
              ("net.minecraft.network.packet", "net.minecraft.network.protocol"),
              ("PlayerListS2CPacket", "ClientboundPlayerInfoUpdatePacket"),
              ("PlayerRemoveS2CPacket", "ClientboundPlayerInfoRemovePacket"),
              ("ServerConfigurationNetworkHandler", "ServerConfigurationPacketListenerImpl"),
              ("ServerPlayNetworkHandler", "ServerGamePacketListenerImpl"),
              ("ServerCommonNetworkHandler", "ServerCommonPacketListenerImpl"),
              ("ConnectedClientData", "CommonListenerCookie"),
              ("ClientConnection", "Connection"),
              ("net.minecraft.resources.ResourceLocation", "net.minecraft.resources.Identifier"),
              ("ResourceLocation.fromNamespaceAndPath", "Identifier.fromNamespaceAndPath"),
              ("S2CConfigurationChannelEvents", "ClientboundConfigurationChannelEvents"),
          ]
          for p in root.rglob("*.java"):
              s=p.read_text()
              for a,b in substitutions:
                  s=s.replace(a,b)
              # GameProfile's post-26.1 value accessors.
              for a,b in [
                  ("gameProfile.getId()", "gameProfile.id()"),
                  ("profile.getId()", "profile.id()"),
                  ("entry.profile().getId()", "entry.profile().id()"),
                  ("gameProfile.getName()", "gameProfile.name()"),
                  ("profile.getName()", "profile.name()"),
                  ("gameProfile.getProperties()", "gameProfile.properties()"),
                  ("profile.getProperties()", "profile.properties()"),
                  ("entry.profile().getProperties()", "entry.profile().properties()"),
              ]:
                  s=s.replace(a,b)
              p.write_text(s)
          # The old Yggdrasil URL whitelist hook was removed from newer authlib.
          mix=root/"main/resources/mostly_server_capes.mixins.json"
          if mix.exists():
              d=json.loads(mix.read_text())
              d["mixins"]=[x for x in d.get("mixins",[]) if x!="TextureUrlCheckerMixin"]
              mix.write_text(json.dumps(d,indent=2)+"\n")
          (root/"main/java/me/zombii/mostly_server_capes/mixin/TextureUrlCheckerMixin.java").unlink(missing_ok=True)
          # Access the renamed server-side profile field explicitly, avoiding brittle name-derived accessors.
          accessor=root/"main/java/me/zombii/mostly_server_capes/mixin/ServerConfigurationPacketListenerImplAccessor.java"
          old=root/"main/java/me/zombii/mostly_server_capes/mixin/ServerConfigurationNetworkHandlerAccessor.java"
          accessor.write_text("""package me.zombii.mostly_server_capes.mixin;
          import com.mojang.authlib.GameProfile;
          import net.minecraft.server.network.ServerConfigurationPacketListenerImpl;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.gen.Accessor;
          @Mixin(ServerConfigurationPacketListenerImpl.class)
          public interface ServerConfigurationPacketListenerImplAccessor {
              @Accessor("gameProfile")
              GameProfile capeCommand$getProfile();
          }
          """)
          old.unlink(missing_ok=True)
          # Remove the old manual full-respawn packet sequence; it is unused by the mod and
          # relies on packet constructors that were redesigned in 26.x.
          p=root/"main/java/me/zombii/mostly_server_capes/MostlyServerCapes.java"
          s=p.read_text()
          start=s.find("\tpublic static void reloadPlayer(")
          if start < 0:
              start=s.find("    public static void reloadPlayer(")
          if start >= 0:
              brace=s.find("{",start); depth=0; end=None
              for i in range(brace,len(s)):
                  if s[i]=="{": depth+=1
                  elif s[i]=="}":
                      depth-=1
                      if depth==0:
                          end=i+1; break
              if end is not None: s=s[:start]+s[end:]
          s=s.replace("ServerConfigurationNetworkHandlerAccessor) handler).getProfile()", "ServerConfigurationPacketListenerImplAccessor) handler).capeCommand$getProfile()")
          s=s.replace("ServerConfigurationPacketListenerImplAccessor) handler).getProfile()", "ServerConfigurationPacketListenerImplAccessor) handler).capeCommand$getProfile()")
          s=s.replace("import me.zombii.mostly_server_capes.mixin.ServerConfigurationNetworkHandlerAccessor;", "import me.zombii.mostly_server_capes.mixin.ServerConfigurationPacketListenerImplAccessor;")
          # Drop imports that were only used by removed reloadPlayer implementation.
          for line in [
              "import net.minecraft.entity.EquipmentSlot;\n",
              "import net.minecraft.entity.effect.StatusEffectInstance;\n",
              "import net.minecraft.item.ItemStack;\n",
              "import net.minecraft.network.packet.s2c.play.*;\n",
              "import net.minecraft.network.protocol.game.*;\n",
              "import net.minecraft.server.PlayerManager;\n",
              "import net.minecraft.server.level.ServerLevel;\n",
              "import net.minecraft.server.world.ServerWorld;\n",
              "import net.minecraft.world.biome.source.BiomeAccess;\n",
              "import com.mojang.datafixers.util.Pair;\n",
              "import java.util.Iterator;\n",
          ]:
              s=s.replace(line,"")
          p.write_text(s)
          # Keep the player-info packet transformation, but adapt packet and listener APIs.
          p=root/"main/java/me/zombii/mostly_server_capes/mixin/ServerGamePacketListenerImplMixin.java"
          old=root/"main/java/me/zombii/mostly_server_capes/mixin/ServerPlayNetworkHandlerMixin.java"
          if old.exists():
              old.rename(p)
          s=p.read_text()
          s=s.replace("PacketCallbacks", "ChannelFutureListener")
          s=s.replace("import net.minecraft.network.PacketCallbacks;", "import io.netty.channel.ChannelFutureListener;")
          s=s.replace("new Entry(entry.profileId(), profile, entry.listed(),\n                            entry.latency(), entry.gameMode(), entry.displayName(),\n                            entry.chatSession())",
                      "new Entry(entry.profileId(), profile, entry.listed(),\n                            entry.latency(), entry.gameMode(), entry.displayName(),\n                            entry.showHat(), entry.listOrder(), entry.chatSession())")
          p.write_text(s)
          # Update packet-entry updater interface and mixin packet class names/package after migration.
          p=root/"main/java/me/zombii/mostly_server_capes/network/PlayerListS2CPacketEntriesUpdater.java"
          if p.exists():
              s=p.read_text().replace("net.minecraft.network.packet.s2c.play", "net.minecraft.network.protocol.game")
              s=s.replace("PlayerListS2CPacket", "ClientboundPlayerInfoUpdatePacket")
              p.write_text(s)
          p=root/"main/java/me/zombii/mostly_server_capes/mixin/PlayerListS2CPacketMixin.java"
          if p.exists():
              s=p.read_text().replace("net.minecraft.network.packet.s2c.play", "net.minecraft.network.protocol.game")
              s=s.replace("PlayerListS2CPacket", "ClientboundPlayerInfoUpdatePacket")
              p.write_text(s)
          # Match Java public type names to their files and update the packet callback API.
          renames = [
              (root/"main/java/me/zombii/mostly_server_capes/network/PlayerListS2CPacketEntriesUpdater.java",
               root/"main/java/me/zombii/mostly_server_capes/network/ClientboundPlayerInfoUpdatePacketEntriesUpdater.java"),
              (root/"main/java/me/zombii/mostly_server_capes/mixin/PlayerListS2CPacketMixin.java",
               root/"main/java/me/zombii/mostly_server_capes/mixin/ClientboundPlayerInfoUpdatePacketMixin.java"),
          ]
          for oldpath,newpath in renames:
              if oldpath.exists(): oldpath.rename(newpath)
          for p in root.rglob("*.java"):
              s=p.read_text()
              s=s.replace("PacketSendListener", "ChannelFutureListener")
              s=s.replace("import net.minecraft.network.ChannelFutureListener;", "import io.netty.channel.ChannelFutureListener;")
              s=s.replace("newProfile.getProperties()", "newProfile.properties()")
              s=s.replace("import net.minecraft.network.protocol.PacketSendListener;\n", "")
              p.write_text(s)
          # The interface file is deliberately renamed because @Accessor mapping follows target names.
          for p in root.rglob("*.java"):
              s=p.read_text()
              s=s.replace("ServerConfigurationNetworkHandlerAccessor", "ServerConfigurationPacketListenerImplAccessor")
              # Actual player entity methods in current mappings.
              s=s.replace("entity.getServer()", "entity.level().getServer()")
              s=s.replace("entity.serverLevel()", "(net.minecraft.server.level.ServerLevel) entity.level()")
              p.write_text(s)
          # Version metadata and mixin compatibility.
          meta=root/"main/resources/fabric.mod.json"
          d=json.loads(meta.read_text())
          d["version"]="26.3-2.0.3-port2"
          d["depends"]["minecraft"]="~26.3"
          d["depends"]["fabricloader"]=">=0.19.5"
          d["depends"]["java"]=">=25"
          meta.write_text(json.dumps(d,indent=2)+"\n")
          for mixpath in [root/"main/resources/mostly_server_capes.mixins.json",root/"client/resources/mostly_server_capes.client.mixins.json"]:
              if mixpath.exists():
                  d=json.loads(mixpath.read_text()); d["compatibilityLevel"]="JAVA_25"; mixpath.write_text(json.dumps(d,indent=2)+"\n")
          # Keep runtime mixin declarations aligned with renamed mixin classes.
          for mixpath in [root/"main/resources/mostly_server_capes.mixins.json"]:
              if mixpath.exists():
                  d=json.loads(mixpath.read_text())
                  d["mixins"]=[{"ServerPlayNetworkHandlerMixin":"ServerGamePacketListenerImplMixin","PlayerListS2CPacketMixin":"ClientboundPlayerInfoUpdatePacketMixin","ServerConfigurationNetworkHandlerAccessor":"ServerConfigurationPacketListenerImplAccessor"}.get(x,x) for x in d.get("mixins",[])]
                  mixpath.write_text(json.dumps(d,indent=2)+"\n")
          # The main source set was migrated by Loom; convert client sources too.
          for p in (root/"client").rglob("*.java"):
              s=p.read_text()
              client_subs = [
                  ("net.minecraft.network.PacketByteBuf", "net.minecraft.network.FriendlyByteBuf"),
                  ("net.minecraft.network.codec.PacketCodec", "net.minecraft.network.codec.StreamCodec"),
                  ("net.minecraft.network.protocol.CustomPayload", "net.minecraft.network.protocol.common.custom.CustomPacketPayload"),
                  ("CustomPayload", "CustomPacketPayload"),
                  ("PayloadTypeRegistry.configurationS2C()", "PayloadTypeRegistry.clientboundConfiguration()"),
                  ("net.minecraft.client.network.PlayerListEntry", "net.minecraft.client.multiplayer.PlayerInfo"),
                  ("net.minecraft.client.util.SkinTextures", "net.minecraft.world.entity.player.PlayerSkin"),
                  ("net.minecraft.client.render.entity.LivingEntityRenderer", "net.minecraft.client.renderer.entity.LivingEntityRenderer"),
                  ("net.minecraft.entity.LivingEntity", "net.minecraft.world.entity.LivingEntity"),
                  ("getUuid()", "getUUID()"),
                  ("Lnet/minecraft/client/util/SkinTextures;secure()Z", "Lnet/minecraft/world/entity/player/PlayerSkin;secure()Z"),
              ]
              for a,b in client_subs: s=s.replace(a,b)
              # Fabric 26.1+ uses official Mojang names in networking registries.
              s=s.replace("PayloadTypeRegistry.configurationS2C()", "PayloadTypeRegistry.clientboundConfiguration()")
              # Rename identifiers as well as package paths in the client source set.
              s=s.replace("PlayerListEntry.class", "PlayerInfo.class")
              s=s.replace("SkinTextures instance", "PlayerSkin instance")
              s=s.replace("new PacketCodec<>", "new StreamCodec<>")
              s=s.replace("decode(PacketByteBuf ", "decode(FriendlyByteBuf ")
              s=s.replace("encode(PacketByteBuf ", "encode(FriendlyByteBuf ")
              # The secure flag is still a record component on PlayerSkin, so the accessor name remains secure().
              p.write_text(s)
          # Keep the stable custom payload id type consistent after migration.
          constants=root/"main/java/me/zombii/mostly_server_capes/Constants.java"
          s=constants.read_text()
          s=s.replace("CustomPayload", "CustomPacketPayload")
          s=s.replace("net.minecraft.network.protocol.CustomPayload", "net.minecraft.network.protocol.common.custom.CustomPacketPayload")
          constants.write_text(s)
          # Update client mixin target names/package. Use PlayerInfo's skin accessor in 26.x.
          p=root/"client/java/me/zombii/mostly_server_capes/mixin/client/PlayerListEntryMixin.java"
          if p.exists():
              s=p.read_text()
              s=s.replace("@Mixin(PlayerInfo.class)", "@Mixin(PlayerInfo.class)")
              s=s.replace('method = "method_52806"', 'method = "getSkin"')
              p.write_text(s)
          print("Applied 26.3 source compatibility fixes.")
          PY
      - name: Compile port
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/msc
          gradle build --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/msc-build.log
      - name: Stage compiled JAR or diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p out
          if [ -d /tmp/msc/build/libs ]; then
            find /tmp/msc/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' -exec cp {} out/ \; || true
          fi
          if [ -f /tmp/msc-build.log ]; then cp /tmp/msc-build.log out/build.log; fi
          if [ -z "$(find out -maxdepth 1 -type f -name '*.jar' -print -quit)" ]; then
            echo "No JAR was produced. Review build.log for the first compile/setup error." > out/ERROR.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mostly-Server-Capes-26.3-port
          path: out/
          if-no-files-found: warn
          retention-days: 7
