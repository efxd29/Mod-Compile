name: Build mod dari zip

# Cara pakai: upload zip project ke folder zips/ (via web GitHub, Add file > Upload files).
# Hasil jar: tab Actions > run terakhir > Artifacts > "hasil". Kalau gagal, ada ERROR.txt di dalamnya.
on:
  push:
    paths: ['zips/*.zip']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Build semua zip yang baru
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          ROOT=$PWD; OUT=$ROOT/out; mkdir -p "$OUT" work "$HOME/gr"
          jh() { printenv "JAVA_HOME_$1_X64"; }
          jset() { export JAVA_HOME="$(jh "$1")"; export PATH="$JAVA_HOME/bin:$PATH"; }
          jmin() { for x in 17 21 25; do [ "$x" -ge "$1" ] && { echo $x; return; }; done; echo 25; }
          pickjava() {
            mc=$(grep -hE '^(minecraft_version|mc_version|minecraft)[ ]*=' gradle.properties 2>/dev/null | head -1 | cut -d= -f2 | tr -d ' \r')
            [ -z "$mc" ] && mc=$(grep -hoE 'com.mojang:minecraft:[0-9.]+' build.gradle* 2>/dev/null | head -1 | cut -d: -f3)
            IFS=. read a b c <<< "$mc"
            a=${a//[!0-9]/}; b=${b//[!0-9]/}; c=${c//[!0-9]/}
            if [ -z "$a" ]; then echo 21
            elif [ "$a" -ge 26 ]; then echo 25
            elif [ "${b:-0}" -ge 21 ]; then echo 21
            elif [ "${b:-0}" -eq 20 ] && [ "${c:-0}" -ge 5 ]; then echo 21
            else echo 17; fi
          }
          gcand() {
            l=$(grep -hEi "loom" build.gradle* settings.gradle* gradle.properties 2>/dev/null | grep -oE "[0-9]+\.[0-9]+" | head -1)
            case $l in
              1.0|1.1) echo "7.6.4 8.1.1";; 1.2) echo "8.1.1 8.5";; 1.3) echo "8.3 8.5";; 1.4) echo "8.4 8.5";;
              1.5) echo "8.5 8.7";; 1.6) echo "8.6 8.8";; 1.7) echo "8.8 8.10.2";; 1.8) echo "8.10.2 8.12";;
              1.9|1.10) echo "8.12 8.14";; 1.11|1.12|1.13) echo "8.14 9.1.0";;
              "") echo "8.14 8.5 9.1.0 7.6.4";; *) echo "9.1.0 8.14";;
            esac
          }
          getgradle() {
            v=$1; d="$HOME/gr/gradle-$v"
            if [ ! -x "$d/bin/gradle" ]; then
              curl -fsSL --retry 5 -o "/tmp/g-$v.zip" "https://services.gradle.org/distributions/gradle-$v-bin.zip" || return 1
              unzip -q "/tmp/g-$v.zip" -d "$HOME/gr" || return 1
            fi
            echo "$d/bin/gradle"
          }
          needj() { grep -oE "requires at least JVM runtime version [0-9]+" "$1" | grep -oE "[0-9]+$" | head -1; }
          needg() { grep -oE "component, as well as attribute 'org.gradle.plugin.api-version' with value '[0-9.]+'" "$1" | head -1 | grep -oE "[0-9]+(\.[0-9]+)+"; }

          build_gradle() {
            n=$1; log="$ROOT/work/$n.log"
            had=0; [ -f gradlew ] && had=1
            jv=$(pickjava); gl=$(gcand)
            lm=$(grep -hEi "loom" build.gradle* settings.gradle* gradle.properties 2>/dev/null | grep -oE "[0-9]+\.[0-9]+" | head -1)
            if [ "${lm%%.*}" = 1 ] && [ "${lm#*.}" -ge 15 ] 2>/dev/null; then gl="9.7.1 9.5.0 $gl"; fi
            [ "$jv" = 25 ] && gl="9.7.1 9.5.0 9.1.0 $gl"
            [ $had -eq 1 ] && gl="orig $gl"
            q=($gl); tries=0; net=0; tried=" "
            while [ ${#q[@]} -gt 0 ] && [ $tries -lt 10 ]; do
              g=${q[0]}; q=("${q[@]:1}"); tries=$((tries+1))
              key="$jv/$g"; case "$tried" in *" $key "*) continue;; esac
              tried="$tried$key "
              jset "$jv"
              echo ">>> [$n] Java $jv | Gradle $g"
              if [ "$g" = orig ]; then chmod +x gradlew; cmd=./gradlew; else cmd=$(getgradle "$g") || continue; fi
              $cmd build --no-daemon --console=plain > "$log" 2>&1; rc=$?
              tail -3 "$log"
              [ $rc -eq 0 ] && return 0
              grep -qE "compileJava.*FAILED|error:" "$log" && return 2
              nj=$(needj "$log"); ng=$(needg "$log")
              if [ -n "$nj" ] && [ "$nj" -gt "$jv" ]; then jv=$(jmin "$nj"); q=("$g" "${q[@]}"); echo ">>> butuh Java >= $nj, pindah ke $jv"; fi
              if [ -n "$ng" ]; then
                echo ">>> butuh Gradle $ng"
                case $ng in *.0) q=("$ng" "${ng%.0}.1" "${ng%.0}.2" "${q[@]}");; *) q=("$ng" "${q[@]}");; esac
              fi
              if grep -qiE "timed out|Connection reset|Could not GET|UnknownHost" "$log" && [ $net -lt 3 ]; then
                net=$((net+1)); q=("$g" "${q[@]}"); tried=" "; sleep 5
              fi
            done
            return 1
          }

          build_maven() {
            n=$1; log="$ROOT/work/$n.log"
            for jv in 17 21 25; do
              jset "$jv"; echo ">>> [$n] Maven | Java $jv"
              mvn -B package -DskipTests > "$log" 2>&1 && return 0
              grep -q "COMPILATION ERROR" "$log" && return 2
            done
            return 1
          }

          if [ "$EVENT" = push ] && [ "${BEFORE#0000000}" = "$BEFORE" ]; then
            list=$(git diff --name-only --diff-filter=AM "$BEFORE" "$SHA" -- 'zips/*.zip' 2>/dev/null)
          else
            list=$(ls zips/*.zip 2>/dev/null)
          fi
          [ -z "${list:-}" ] && { echo "tidak ada zip baru untuk dibuild"; exit 0; }

          : > "$ROOT/work/summary.txt"
          for z in $list; do
            n=$(basename "$z" .zip); mkdir -p "$OUT/$n" "work/$n"
            if ! unzip -q -o "$z" -d "work/$n"; then echo "unzip gagal" > "$OUT/$n/ERROR.txt"; echo "✗ $n (zip rusak)" >> work/summary.txt; continue; fi
            f=$(find "work/$n" -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts -o -name pom.xml \) | head -1)
            if [ -z "$f" ]; then echo "build.gradle atau pom.xml tidak ketemu di zip" > "$OUT/$n/ERROR.txt"; echo "✗ $n (bukan project)" >> work/summary.txt; continue; fi
            cd "$(dirname "$f")"
            if [ -f pom.xml ] && ! ls build.gradle* >/dev/null 2>&1; then build_maven "$n"; rc=$?; jars=$(ls target/*.jar 2>/dev/null | grep -vE "original-|-sources|-javadoc")
            else build_gradle "$n"; rc=$?; jars=$(ls build/libs/*.jar 2>/dev/null | grep -vE -- "-sources|-dev|-javadoc"); fi
            cp "$ROOT/work/$n.log" "$OUT/$n/build.log" 2>/dev/null
            if [ $rc -eq 0 ] && [ -n "$jars" ]; then
              cp $jars "$OUT/$n/"; echo "✓ $n" >> "$ROOT/work/summary.txt"
            else
              grep -A2 "error:" "$ROOT/work/$n.log" > "$OUT/$n/ERROR.txt" 2>/dev/null
              [ -s "$OUT/$n/ERROR.txt" ] || tail -60 "$ROOT/work/$n.log" > "$OUT/$n/ERROR.txt"
              if [ $rc -eq 2 ]; then echo "✗ $n (error di kode)" >> "$ROOT/work/summary.txt"; else echo "✗ $n (gagal setup)" >> "$ROOT/work/summary.txt"; fi
            fi
            cd "$ROOT"
          done
          cat work/summary.txt; cat work/summary.txt >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hasil
          path: out/
          if-no-files-found: warn
