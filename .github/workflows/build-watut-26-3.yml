name: Build WATUT 26.3 Fabric

on:
  push:
    paths:
      - 'zips/trigger-watut-26-3-build'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build controller
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Get Jonahnm WATUT 26.2 source
        shell: bash
        run: git clone --depth 1 --branch 26.2 https://github.com/jonahnm/WATUT.git watut

      - name: Retarget original-derived source to Minecraft 26.3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("watut")
          props = root / "gradle.properties"
          s = props.read_text()

          replacements = {
              "minecraft_version": "26.3",
              "yarn_mappings": "26.3+build.1",
              "loader_version": "0.19.5",
              "fabric_version": "0.163.0+26.3",
              "mod_version": "26.3-1.2.8",
              "neo_version_range": "[26.3,)",
              "minecraft_version_range": "[26.3,27)",
          }
          for key, value in replacements.items():
              pat = rf"(?m)^([ \t]*{re.escape(key)}[ \t]*=).*?$"
              s, count = re.subn(pat, lambda m: m.group(1) + value, s, count=1)
              if count == 0:
                  if key in {"neo_version_range", "minecraft_version_range"}:
                      continue
                  raise SystemExit(f"Required property not found: {key}")
          props.write_text(s)

          build = root / "build_fabric.gradle"
          s = build.read_text()
          s, count = re.subn(
              r"id 'fabric-loom' version '[^']+'",
              "id 'fabric-loom' version '1.17.21'",
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update Fabric Loom plugin version")

          s, count = re.subn(
              r"mappings loom\.layered\(\)\s*\{\s*officialMojangMappings\(\)\s*parchment\([^\n]*\)\s*\}",
              "mappings loom.layered() {\n        officialMojangMappings()\n    }",
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not remove old-version Parchment mappings block")

          # The pinned ForgeConfigAPIPort artifact was for an old MC version and is not used by WATUT source.
          s = re.sub(r"(?m)^\s*include\(modImplementation\(\"curse\.maven:forge-config-api-port-fabric-547434:[^\"]+\"\)\)\s*\n", "", s)
          build.write_text(s)

          meta = root / "src/main/resources/fabric.mod.json"
          data = json.loads(meta.read_text())
          deps = data.setdefault("depends", {})
          deps.update({
              "fabricloader": ">=0.19.5",
              "coroutil": ">=26.3-1.3.8",
              "fabric-api": "*",
              "minecraft": "~26.3",
              "java": ">=25",
          })
          meta.write_text(json.dumps(data, indent=2) + "\n")

          print("Patched WATUT build target to Minecraft 26.3 / Fabric.")
          print("gradle.properties target lines:")
          for line in props.read_text().splitlines():
              if any(line.strip().startswith(k + "=") for k in replacements):
                  print(line)
          PY

      - name: Select Fabric build script
        shell: bash
        run: cp watut/build_fabric.gradle watut/build.gradle

      - name: Install Gradle 9.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 https://services.gradle.org/distributions/gradle-9.7.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-9.7.1/bin" >> "$GITHUB_PATH"

      - name: Compile Fabric JAR
        shell: bash
        working-directory: watut
        run: |
          set +e
          gradle build --no-daemon --console=plain --stacktrace > "$GITHUB_WORKSPACE/out-build.log" 2>&1
          rc=$?
          set -e
          cat "$GITHUB_WORKSPACE/out-build.log"
          mkdir -p out
          cp "$GITHUB_WORKSPACE/out-build.log" out/build.log
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Verify compiled JAR and target metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find watut/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*javadoc*' -size +0c | head -n 1)"
          test -n "$JAR"
          cp "$JAR" out/WATUT-26.3-Fabric.jar
          unzip -t out/WATUT-26.3-Fabric.jar
          unzip -p out/WATUT-26.3-Fabric.jar fabric.mod.json > out/fabric.mod.json
          grep -q '"minecraft": "~26.3"' out/fabric.mod.json
          grep -q '"fabricloader": ">=0.19.5"' out/fabric.mod.json
          echo "Artifact validated: WATUT-26.3-Fabric.jar"

      - name: Upload build output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WATUT-26.3-Fabric
          path: out/
          if-no-files-found: warn
          retention-days: 7
