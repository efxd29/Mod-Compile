name: Build WATUT Jonahnm source for Minecraft 26.3 Fabric

on:
  push:
    branches: [watut-26.3]
    paths:
      - '.github/workflows/build-watut-26-3.yml'
      - 'zips/trigger-watut-26-3-build'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watut-jonahnm-26.3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout build workflow
        uses: actions/checkout@v4
        with:
          ref: watut-26.3

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Get CoroUtil dependency and Jonahnm WATUT source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.21.0 https://github.com/Corosauce/CoroUtil.git CoroUtil
          git clone --depth 1 --branch 26.2 https://github.com/jonahnm/WATUT.git WATUT
          curl --fail --location --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/efxd29/Mod-Compile/watut-full-26.3/port-watut-26.3/patch.py \
            -o /tmp/patch-watut-26.3.py

      - name: Apply Minecraft 26.3 compatibility patches to Jonahnm source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile /tmp/patch-watut-26.3.py
          python3 /tmp/patch-watut-26.3.py CoroUtil coroutil
          python3 /tmp/patch-watut-26.3.py WATUT watut
          sed -i 's/^mod_version=26.3-1.2.7-port.1$/mod_version=26.3-1.2.8-jonah.1/' WATUT/gradle.properties
          cp CoroUtil/build_fabric.gradle CoroUtil/build.gradle
          cp WATUT/build_fabric.gradle WATUT/build.gradle
          echo "Source: jonahnm/WATUT branch 26.2"
          grep -E '^(minecraft_version|loader_version|fabric_version|mod_version|coroutil_version)=' WATUT/gradle.properties

      - name: Build CoroUtil for 26.3
        id: coroutil
        shell: bash
        run: |
          set -uo pipefail
          cd CoroUtil
          set +e
          gradle --no-daemon --console=plain --stacktrace clean build 2>&1 | tee ../coroutil-build.log
          rc=${PIPESTATUS[0]}
          echo "COROUTIL_RC=$rc" >> "$GITHUB_ENV"
          exit "$rc"

      - name: Install CoroUtil into temporary Maven Local
        shell: bash
        run: |
          set -euo pipefail
          artifact="CoroUtil/build/libs/coroutil-fabric-26.3-1.3.8.jar"
          test -s "$artifact"
          dest="$HOME/.m2/repository/com/corosus/coroutil/coroutil-fabric/26.3-1.3.8"
          mkdir -p "$dest"
          cp "$artifact" "$dest/coroutil-fabric-26.3-1.3.8.jar"
          cat > "$dest/coroutil-fabric-26.3-1.3.8.pom" <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.corosus.coroutil</groupId>
            <artifactId>coroutil-fabric</artifactId>
            <version>26.3-1.3.8</version>
            <packaging>jar</packaging>
          </project>
          POM

      - name: Compile Jonahnm WATUT against 26.3
        id: watut
        shell: bash
        run: |
          set -uo pipefail
          cd WATUT
          set +e
          gradle --no-daemon --console=plain --stacktrace clean build 2>&1 | tee ../watut-build.log
          rc=${PIPESTATUS[0]}
          echo "WATUT_RC=$rc" >> "$GITHUB_ENV"
          exit "$rc"

      - name: Verify mod JAR and target metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find WATUT/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*javadoc*' -size +0c | head -n 1)"
          test -n "$JAR"
          mkdir -p out
          cp "$JAR" out/WATUT-26.3-Fabric-Jonahnm.jar
          unzip -t out/WATUT-26.3-Fabric-Jonahnm.jar
          unzip -p out/WATUT-26.3-Fabric-Jonahnm.jar fabric.mod.json > out/fabric.mod.json
          grep -q '"minecraft": "~26.3"' out/fabric.mod.json
          grep -q '"fabricloader": ">=0.19.5"' out/fabric.mod.json
          cp WATUT/build.gradle out/build.gradle
          cp WATUT/gradle.properties out/gradle.properties
          cp watut-build.log out/build.log
          echo "Compiled from jonahnm/WATUT branch 26.2; target metadata set to Minecraft 26.3." > out/BUILD-STATUS.txt
          unzip -l out/WATUT-26.3-Fabric-Jonahnm.jar >> out/BUILD-STATUS.txt

      - name: Upload JAR and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WATUT-26.3-Fabric-Jonahnm
          path: |
            out/
            coroutil-build.log
            watut-build.log
          if-no-files-found: warn
          retention-days: 30
