name: WATUT full feature port for Minecraft 26.3

on:
  push:
    branches: [watut-full-26.3]
    paths:
      - ".github/workflows/watut-26.3.yml"
      - "port-watut-26.3/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watut-full-26.3
  cancel-in-progress: true

jobs:
  port-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout port recipe
        uses: actions/checkout@v4
        with:
          ref: watut-full-26.3

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Fetch complete upstream source trees
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.21.0 https://github.com/Corosauce/CoroUtil.git CoroUtil
          git clone --depth 1 --branch 1.21.0 https://github.com/Corosauce/WATUT.git WATUT

      - name: Apply 26.3 build metadata without dropping original source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile port-watut-26.3/patch.py
          python3 port-watut-26.3/patch.py CoroUtil coroutil
          python3 port-watut-26.3/patch.py WATUT watut
          cp CoroUtil/build_fabric.gradle CoroUtil/build.gradle
          cp WATUT/build_fabric.gradle WATUT/build.gradle

      - name: Build CoroUtil against 26.3
        id: coroutil
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd CoroUtil
          echo "### Patched Gradle configuration" | tee ../coroutil-build.log
          grep -nE 'mappings|include\\(|implementation|publisher|components\\.java' build.gradle | tee -a ../coroutil-build.log || true
          gradle --no-daemon --console=plain --stacktrace clean build 2>&1 | tee -a ../coroutil-build.log
          rc=${PIPESTATUS[0]}
          echo "COROUTIL_RC=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: Install CoroUtil into temporary Maven Local
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact="CoroUtil/build/libs/coroutil-fabric-26.3-1.3.8.jar"
          if [ ! -f "$artifact" ]; then
            echo "CoroUtil JAR missing; check coroutil-build.log"
            exit 1
          fi
          dest="$HOME/.m2/repository/com/corosus/coroutil/coroutil-fabric/26.3-1.3.8"
          mkdir -p "$dest"
          cp "$artifact" "$dest/coroutil-fabric-26.3-1.3.8.jar"
          cat > "$dest/coroutil-fabric-26.3-1.3.8.pom" <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.corosus.coroutil</groupId>
            <artifactId>coroutil-fabric</artifactId>
            <version>26.3-1.3.8</version>
            <packaging>jar</packaging>
          </project>
          POM

      - name: Build complete WATUT source against 26.3
        id: watut
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd WATUT
          echo "### Patched Gradle configuration" | tee ../watut-build.log
          grep -nE 'mappings|include\\(|implementation|publisher|components\\.java' build.gradle | tee -a ../watut-build.log || true
          gradle --no-daemon --console=plain --stacktrace clean build 2>&1 | tee -a ../watut-build.log
          rc=${PIPESTATUS[0]}
          echo "WATUT_RC=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: Package JARs, source snapshot, and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/diagnostics artifacts/source
          cp coroutil-build.log watut-build.log artifacts/diagnostics/ 2>/dev/null || true
          for jar in CoroUtil/build/libs/*.jar WATUT/build/libs/*.jar; do
            [ -f "$jar" ] || continue
            case "$jar" in *-dev.jar|*-sources.jar|*-javadoc.jar) continue ;; esac
            cp "$jar" artifacts/
          done
          cp -R CoroUtil/src WATUT/src artifacts/source/ 2>/dev/null || true
          {
            echo "Minecraft target: 26.3"
            echo "Java: $(java -version 2>&1 | head -1)"
            echo "CoroUtil build status: ${COROUTIL_RC:-unknown}"
            echo "WATUT build status: ${WATUT_RC:-unknown}"
            echo "Original WATUT source and resources are retained; no mini-rewrite is used."
          } > artifacts/BUILD-STATUS.txt
          find artifacts -type f -printf '%p %s bytes\n' | sort >> artifacts/BUILD-STATUS.txt

      - name: Upload built JARs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WATUT-Minecraft-26.3-full-port
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify both complete mod builds
        if: always()
        shell: bash
        run: |
          test "${COROUTIL_RC:-1}" = "0" || { echo "CoroUtil build failed"; exit 1; }
          test "${WATUT_RC:-1}" = "0" || { echo "WATUT build failed"; exit 1; }
          test -f artifacts/coroutil-fabric-26.3-1.3.8.jar || { echo "CoroUtil remapped JAR missing"; exit 1; }
          test -f artifacts/watut-fabric-26.3-1.2.7-port.1.jar || { echo "WATUT remapped JAR missing"; exit 1; }
