name: Build Perf Share APK

on:
  push:
    branches: [perf-share-apk]
    paths:
      - 'zips/trigger-perf-share-build'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source parts
        uses: actions/checkout@v4

      - name: Decode source archive
        shell: bash
        run: |
          set -euo pipefail
          cat zips/perf-share-source-part*.b64 | base64 --decode > /tmp/perfshare.tar.gz
          mkdir -p /tmp/perfshare
          tar -tzf /tmp/perfshare.tar.gz >/dev/null
          tar -xzf /tmp/perfshare.tar.gz -C /tmp/perfshare
          test -f /tmp/perfshare/PerfShare_git/settings.gradle
          test -f /tmp/perfshare/PerfShare_git/app/build.gradle
          echo "Source archive decoded and required Gradle files found."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/perfshare/PerfShare_git
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify APK and report metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/perfshare/PerfShare_git/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$APK" "$GITHUB_WORKSPACE/out/PerfShare.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GITHUB_WORKSPACE/out/PerfShare.apk" | head -20
          sha256sum "$GITHUB_WORKSPACE/out/PerfShare.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfShare-APK
          path: out/PerfShare.apk
          if-no-files-found: error
          retention-days: 7
