name: Build Keyboard Chat Lift (Minecraft 26.3)

on:
  push:
    branches:
      - build-keyboard-chat-lift-mc26.3
    paths:
      - 'keyboard-chat-lift/**'
      - '.github/workflows/keyboard-chat-lift.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.7.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Compile mod
        run: |
          set -euo pipefail
          cd keyboard-chat-lift
          /tmp/gradle-9.7.1/bin/gradle build --no-daemon --stacktrace --console=plain > build.log 2>&1 || { tail -n 160 build.log; exit 1; }
          tail -n 40 build.log
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-chat-lift-mc26.3
          path: |
            keyboard-chat-lift/build/libs/*.jar
            keyboard-chat-lift/build.log
          if-no-files-found: warn
          retention-days: 14
